name: hyner
description: Hyner QuickPrice — merchant-configurable measured-product pricing.
publish_to: none
version: 0.6.0+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # The generated web plugin registrant imports this SDK package.
  flutter_web_plugins:
    sdk: flutter
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  image: ^4.12.0
  archive: ^4.6.0
  printing: ^5.15.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  file_picker: ^10.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  sqflite_common_ffi: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/google-g.png
    - assets/branding/hyner-mark.svg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# Verified upstream SQLite source; builds the same library for host and Android.
# See third_party/sqlite/README.md for provenance and the archive checksum.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
