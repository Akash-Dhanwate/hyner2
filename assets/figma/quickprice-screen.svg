<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>Hyner QuickPrice — Figma reference</title>
  <desc>Static visual reference based on the current Flutter QuickPrice screen. Import into Figma and ungroup to redesign.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#175C46" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Flutter theme: sage green / light surface -->
  <rect width="390" height="844" fill="#FAFDF9"/>

  <!-- AppBar -->
  <rect x="0" y="0" width="390" height="64" fill="#FAFDF9"/>
  <text x="20" y="40" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700">QuickPrice</text>
  <g transform="translate(300 20)" fill="none" stroke="#526157" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 5h18v15H3z"/>
    <path d="M7 2v6M17 2v6M3 10h18"/>
    <path d="M7 14h3M15 14h3M7 18h3"/>
  </g>
  <circle cx="320" cy="19" r="7" fill="#175C46"/>
  <text x="320" y="22" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="9" font-weight="700">2</text>
  <g transform="translate(352 20)" fill="none" stroke="#526157" stroke-width="2" stroke-linecap="round">
    <circle cx="3" cy="3" r="1" fill="#526157"/><circle cx="3" cy="10" r="1" fill="#526157"/><circle cx="3" cy="17" r="1" fill="#526157"/>
  </g>

  <!-- Scrollable content -->
  <text x="20" y="94" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="14">On this device</text>
  <text x="20" y="126" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600">Standard rates</text>

  <!-- Product ChoiceChip -->
  <rect x="20" y="150" width="112" height="36" rx="8" fill="#E2F0E8" stroke="#175C46"/>
  <text x="76" y="173" text-anchor="middle" fill="#175C46" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600">Window</text>
  <rect x="140" y="150" width="104" height="36" rx="8" fill="#FAFDF9" stroke="#DCE3DA"/>
  <text x="192" y="173" text-anchor="middle" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="14">Door</text>

  <text x="20" y="222" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600">Measurements</text>

  <!-- Input fields -->
  <rect x="20" y="240" width="350" height="58" rx="10" fill="#FFFEFB" stroke="#76877B"/>
  <text x="34" y="262" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="12">Width</text>
  <text x="34" y="284" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="16">120</text>
  <text x="345" y="284" text-anchor="end" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="14">cm</text>

  <rect x="20" y="312" width="350" height="58" rx="10" fill="#FFFEFB" stroke="#76877B"/>
  <text x="34" y="334" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="12">Height</text>
  <text x="34" y="356" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="16">150</text>
  <text x="345" y="356" text-anchor="end" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="14">cm</text>

  <!-- Quantity control -->
  <text x="20" y="405" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600">Quantity</text>
  <rect x="20" y="420" width="168" height="48" rx="10" fill="#FFFEFB" stroke="#76877B"/>
  <text x="48" y="451" text-anchor="middle" fill="#175C46" font-family="Arial" font-size="22">−</text>
  <text x="104" y="451" text-anchor="middle" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600">1</text>
  <text x="160" y="451" text-anchor="middle" fill="#175C46" font-family="Arial" font-size="22">+</text>

  <!-- Fixed bottom price panel -->
  <rect x="0" y="548" width="390" height="296" fill="#FFFEFB" stroke="#DCE3DA" filter="url(#shadow)"/>
  <text x="20" y="580" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="14">Current item total</text>
  <text x="20" y="622" fill="#175C46" font-family="Manrope, Arial, sans-serif" font-size="32" font-weight="700">₹ 3,240</text>
  <text x="20" y="648" fill="#526157" font-family="Manrope, Arial, sans-serif" font-size="13">Includes applicable tax</text>

  <rect x="20" y="670" width="350" height="52" rx="10" fill="#175C46"/>
  <text x="195" y="703" text-anchor="middle" fill="#FFFFFF" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700">＋  Add to Estimate</text>
  <rect x="20" y="730" width="350" height="48" rx="10" fill="#FFFEFB" stroke="#76877B"/>
  <text x="195" y="760" text-anchor="middle" fill="#222D27" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600">2 items · ₹ 6,480 · View estimate</text>
  <text x="110" y="812" text-anchor="middle" fill="#175C46" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600">Quotation</text>
  <text x="280" y="812" text-anchor="middle" fill="#175C46" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="600">Price breakdown</text>
</svg>
